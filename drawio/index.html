<!DOCTYPE html>
<html>
<head>
    <title>FlowDraw</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="Description" content="FlowDraw – akış şeması ve süreç çizim aracı">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="msapplication-config" content="images/browserconfig.xml">
    <meta name="mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#d89000">
	<link rel="manifest" href="images/manifest.json">
	<link rel="icon" href="../logo.svg" type="image/svg+xml">
	
    <link rel="apple-touch-icon" href="../logo-180.png">
    <link rel="stylesheet" type="text/css" href="styles/grapheditor.css">
	<link rel="stylesheet" media="(forced-colors: active)" href="styles/high-contrast.css" id="high-contrast-stylesheet">
	<script src="js/bootstrap.js"></script>
	<style type="text/css">
		#geInfo {
			display:flex;
			flex-direction:column;
			align-items:center;
			justify-content:center;
			gap:24px;
			padding:16px 16px 10vh 16px;
			text-align:center;
		}
		#geInfo noscript {
			max-width:600px;
		}
		#geStatus:empty {
			display:none;
		}
		#geStatus a {
			text-decoration:underline;
			cursor:pointer;
		}
		.geSplashLogo {
			width:72px;
			height:72px;
			animation:geSplashPulse 1.2s ease-in-out infinite alternate;
		}
		#geInfo:has(#geStatus:not(:empty)) .geSplashLogo {
			animation:none;
		}
		@media (prefers-reduced-motion: reduce), (scripting: none) {
			.geSplashLogo {
				animation:none;
			}
		}
		@keyframes geSplashPulse {
			from {
				opacity:1;
				transform:scale(1);
			}
			to {
				opacity:0.55;
				transform:scale(0.95);
			}
		}
	</style>
</head>
<body class="geEditor geClassic">
<div id="geInfo">
	<img class="geSplashLogo" src="../logo.svg" alt="FlowDraw">
	<div id="geStatus"></div>
	<noscript><h1>FlowDraw</h1><p>FlowDraw için JavaScript gereklidir.</p></noscript>
</div>
<script src="js/main.js"></script>
</body>
</html>
